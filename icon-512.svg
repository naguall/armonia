<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5C8A"/>
      <stop offset="50%" stop-color="#4A7FB8"/>
      <stop offset="100%" stop-color="#C77B2A"/>
    </linearGradient>
    <linearGradient id="sym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7ECF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>
  <g filter="url(#shadow)" transform="translate(256 270)">
    <circle cx="0" cy="78" r="38" fill="url(#sym)"/>
    <path d="M 0 78 L 0 -112 Q 50 -112 60 -62 Q 70 -14 22 6 Q -50 38 -10 86"
          stroke="url(#sym)" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-14" cy="-6" r="7" fill="url(#bg)"/>
  </g>
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="800" font-size="48" fill="#FFFFFF" opacity="0.95" letter-spacing="6">ARMONÍA</text>
</svg>
