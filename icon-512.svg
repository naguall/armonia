<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1038"/>
      <stop offset="60%" stop-color="#2E5C8A"/>
      <stop offset="100%" stop-color="#4A7FB8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E29A4F"/>
      <stop offset="100%" stop-color="#C77B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>
  <!-- Piano keys -->
  <g transform="translate(76 302)">
    <rect x="0" y="0" width="360" height="140" rx="14" fill="#F5F7FB" stroke="#2E5C8A" stroke-width="4"/>
    <line x1="60" y1="0" x2="60" y2="140" stroke="#2E5C8A" stroke-width="3"/>
    <line x1="120" y1="0" x2="120" y2="140" stroke="#2E5C8A" stroke-width="3"/>
    <line x1="180" y1="0" x2="180" y2="140" stroke="#2E5C8A" stroke-width="3"/>
    <line x1="240" y1="0" x2="240" y2="140" stroke="#2E5C8A" stroke-width="3"/>
    <line x1="300" y1="0" x2="300" y2="140" stroke="#2E5C8A" stroke-width="3"/>
    <!-- black keys -->
    <rect x="38" y="0" width="38" height="86" rx="4" fill="#1A1038"/>
    <rect x="102" y="0" width="38" height="86" rx="4" fill="#1A1038"/>
    <rect x="222" y="0" width="38" height="86" rx="4" fill="url(#accent)"/>
    <rect x="284" y="0" width="38" height="86" rx="4" fill="#1A1038"/>
  </g>
  <!-- Soundwave arcs -->
  <g fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round">
    <path d="M 132 222 Q 256 142 380 222" opacity="0.95"/>
    <path d="M 96 176 Q 256 66 416 176" opacity="0.7"/>
    <path d="M 58 132 Q 256 0 454 132" opacity="0.4"/>
  </g>
  <!-- Letter A -->
  <g transform="translate(256 202)" fill="#F5F7FB">
    <path d="M -50 56 L 0 -62 L 50 56 Z" fill="none" stroke="#F5F7FB" stroke-width="14" stroke-linejoin="round"/>
    <line x1="-34" y1="26" x2="34" y2="26" stroke="#F5F7FB" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
