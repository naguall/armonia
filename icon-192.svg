<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1038"/>
      <stop offset="100%" stop-color="#2E5C8A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E29A4F"/>
      <stop offset="100%" stop-color="#C77B2A"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" ry="42" fill="url(#bg)"/>
  <!-- Piano keys strip -->
  <g transform="translate(28 112)">
    <rect x="0" y="0" width="136" height="52" rx="6" fill="#F5F7FB" stroke="#2E5C8A" stroke-width="2"/>
    <line x1="22" y1="0" x2="22" y2="52" stroke="#2E5C8A" stroke-width="1.5"/>
    <line x1="45" y1="0" x2="45" y2="52" stroke="#2E5C8A" stroke-width="1.5"/>
    <line x1="68" y1="0" x2="68" y2="52" stroke="#2E5C8A" stroke-width="1.5"/>
    <line x1="91" y1="0" x2="91" y2="52" stroke="#2E5C8A" stroke-width="1.5"/>
    <line x1="114" y1="0" x2="114" y2="52" stroke="#2E5C8A" stroke-width="1.5"/>
    <!-- black keys -->
    <rect x="14" y="0" width="14" height="32" rx="2" fill="#1A1038"/>
    <rect x="38" y="0" width="14" height="32" rx="2" fill="#1A1038"/>
    <rect x="84" y="0" width="14" height="32" rx="2" fill="url(#accent)"/>
    <rect x="107" y="0" width="14" height="32" rx="2" fill="#1A1038"/>
  </g>
  <!-- Soundwave arcs over piano -->
  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
    <path d="M 50 82 Q 96 52 142 82" opacity="0.95"/>
    <path d="M 36 66 Q 96 26 156 66" opacity="0.7"/>
    <path d="M 22 50 Q 96 0 170 50" opacity="0.4"/>
  </g>
  <!-- Letter A (Armonía) -->
  <g transform="translate(96 76)" fill="#F5F7FB">
    <path d="M -18 20 L 0 -22 L 18 20 Z M -12 10 L 12 10" stroke="#F5F7FB" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  </g>
</svg>
