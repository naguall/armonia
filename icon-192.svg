<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5C8A"/>
      <stop offset="50%" stop-color="#4A7FB8"/>
      <stop offset="100%" stop-color="#C77B2A"/>
    </linearGradient>
    <linearGradient id="sym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7ECF5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" ry="42" fill="url(#bg)"/>
  <!-- Double sharp / music symbol representing armonia -->
  <g filter="url(#shadow)" transform="translate(96 100)">
    <!-- Treble-ish flourish simplified -->
    <circle cx="0" cy="30" r="14" fill="url(#sym)"/>
    <path d="M 0 30 L 0 -42 Q 18 -42 22 -24 Q 26 -6 8 2 Q -18 14 -4 32"
          stroke="url(#sym)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-6" cy="-2" r="2.5" fill="url(#bg)"/>
  </g>
  <text x="96" y="168" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" opacity="0.95" letter-spacing="2">ARMONÍA</text>
</svg>
