<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Limpiando ARMONÍA...</title>
<style>body{font-family:system-ui;background:#0e1220;color:#e7ecf5;padding:2rem;text-align:center}h1{color:#E29A4F}p{margin:1rem 0}#status{font-size:1.2rem;color:#4CAF8E}</style>
</head><body>
<h1>Limpiando cache viejo...</h1>
<p id="status">Trabajando...</p>
<script>
async function nuke(){
  const s = document.getElementById('status');
  // 1. Unregister ALL service workers
  if('serviceWorker' in navigator){
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const r of regs){ await r.unregister(); }
    s.textContent = 'SW eliminados: ' + regs.length;
  }
  // 2. Delete ALL caches
  const keys = await caches.keys();
  for(const k of keys){ await caches.delete(k); }
  s.textContent += ' | Caches borrados: ' + keys.length;
  // 3. Redirect to app with cache buster
  s.textContent += ' | Redirigiendo en 2s...';
  setTimeout(()=>{
    window.location.href = 'APP_ARMONIA_Prototipo.html?v=' + Date.now();
  }, 2000);
}
nuke();
</script>
</body></html>
